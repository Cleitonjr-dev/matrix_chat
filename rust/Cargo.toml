[package]
name = "rust_lib_matrix_chat"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.104"
flutter_rust_bridge = "=2.13.0"
futures-util = "0.3.34"
matrix-sdk = { version = "0.19.1", default-features = false, features = ["sqlite", "rustls-aws-lc-rs", "bundled-sqlite"] }
once_cell = "1.21.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time"] }
url = "2.5.8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
